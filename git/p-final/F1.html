<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>فرم تشخیص اولیه شبکه</title>
<style>
@font-face{font-family:IRANSansLocal;src:local("IRANSans"),local("IRANSansWeb")}body{font-family:IRANSansLocal,IRANSans,Tahoma,Arial,sans-serif;background:#f4f6f8;color:#17202a;max-width:850px;margin:35px auto;padding:0 18px;line-height:1.9}h1{text-align:center;font-size:27px;background:linear-gradient(90deg,#075985,#0e7490,#14b8a6);-webkit-background-clip:text;color:transparent}.card{background:#fff;border:1px solid #d8dee4;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 4px 14px #07598518;border-right:6px solid #0e7490}.card:nth-of-type(2){border-right-color:#7c3aed}.card:nth-of-type(3){border-right-color:#ea580c}.card:nth-of-type(4){border-right-color:#059669}h2{color:#075985;font-size:19px;border-bottom:2px solid #bae6fd;padding-bottom:7px}label{display:block;margin-top:12px;font-weight:bold;color:#24445c}input,textarea,select{font-family:inherit;width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px;direction:rtl;background:#fff}textarea{min-height:75px;resize:vertical}.optional{color:#64748b;font-size:13px;font-weight:normal}.hidden{display:none}.actions{text-align:center;margin:20px 0}button{font-family:inherit;background:#075985;color:#fff;border:0;border-radius:7px;padding:11px 20px;font-size:15px;cursor:pointer;margin:4px}
</style></head><body><h1>فرم تشخیص اولیه شبکه</h1>
<section class="card"><h2>۱. نوع و محدوده مشکل</h2><label>نوع مشکل</label><select id="ISSUE_TYPE"><option>عدم دریافت IP</option><option>قطع ارتباط یک کلاینت</option><option>قطع ارتباط چند کلاینت</option><option>ارتباط نداشتن بین VLANها</option><option>مشکل بین سوئیچ‌ها</option><option>کندی یا قطعی کل شبکه</option><option>مشکل SSH یا Telnet</option><option>سایر</option></select><label>مشکل مربوط به</label><select id="SCOPE" onchange="toggleClient()"><option value="یک کلاینت">یک کلاینت</option><option value="چند کلاینت">چند کلاینت</option><option value="یک VLAN یا بخش شبکه">یک VLAN یا بخش شبکه</option><option value="ارتباط بین سوئیچ‌ها">ارتباط بین سوئیچ‌ها</option><option value="روتر">روتر</option><option value="کل شبکه">کل شبکه</option><option value="نامشخص">نامشخص</option></select><label>شرح کوتاه مشکل</label><textarea id="PROBLEM" placeholder="مثال: PC1 از صبح IP دریافت نمی‌کند"></textarea></section>
<section class="card"><h2>۲. اطلاعات حداقلی تجهیزات</h2><label>نام روترها <span class="optional">(اختیاری؛ با ویرگول جدا کنید)</span></label><input id="ROUTERS" placeholder="مثال: Router0"><label>نام سوئیچ‌ها <span class="optional">(اختیاری؛ با ویرگول جدا کنید)</span></label><input id="SWITCHES" placeholder="مثال: SW7, SW8"><label>سایر تجهیزات <span class="optional">(سرور، فایروال، اکسس‌پوینت؛ اختیاری)</span></label><input id="OTHER_EQUIPMENT" placeholder="مثال: Server1, Firewall1"><label>آیا اخیراً تغییری انجام شده است؟</label><input id="RECENT_CHANGE" placeholder="در صورت وجود توضیح دهید"></section>
<section class="card hidden" id="clientCard"><h2>۳. اطلاعات کلاینت</h2><label>نام کلاینت</label><input id="AFFECTED_CLIENT" placeholder="مثال: PC1"><label>سوئیچ متصل</label><input id="CONNECTED_SWITCH" placeholder="مثال: SW7"><label>پورت متصل</label><input id="CONNECTED_PORT" placeholder="مثال: Fa0/4"><label>VLAN مورد انتظار</label><input id="EXPECTED_VLAN" placeholder="مثال: VLAN 10"></section>
<div class="actions"><button onclick="downloadForm1()">دانلود فرم اولیه</button><button onclick="window.print()">چاپ یا ذخیره PDF</button></div>
<script>function toggleClient(){let s=document.getElementById('SCOPE').value;document.getElementById('clientCard').classList.toggle('hidden',!s.includes('کلاینت'))}function downloadForm1(){let keys=['ISSUE_TYPE','SCOPE','PROBLEM','ROUTERS','SWITCHES','OTHER_EQUIPMENT','AFFECTED_CLIENT','CONNECTED_SWITCH','CONNECTED_PORT','EXPECTED_VLAN','RECENT_CHANGE'];let out='فرم ۱: اطلاعات اولیه شبکه\n\n';keys.forEach(k=>out+=k+': '+document.getElementById(k).value+'\n');let blob=new Blob([out],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='form1-filled.txt';a.click();URL.revokeObjectURL(a.href)}toggleClient();</script></body></html>
